# Custom TruffleHog-Detektoren fuer icepaule-Repos
#
# Ergaenzen die eingebauten Detektoren (AWS/Slack/Stripe/...), die generische
# Tasmota-Konsolenbefehle mit Klartext-WiFi/MQTT-Zugangsdaten NICHT erkennen:
# kein bekanntes Token-Format, zu niedrige Entropie fuer die Standard-Heuristiken
# (selbstgewaehlte Woerter statt zufaelliger Zeichenketten).
#
# Ursprung: IceMatrix-Repo hatte "Backlog SSId1 ...; Password1 ..." und
# "MqttHost ...; MqttUser ...; MqttPassword ..." monatelang im Klartext in der
# Git-History, ohne dass der taegliche Scan das je gemeldet hat (2026-07-25
# gefunden + per git filter-repo bereinigt). Diese Detektoren sollen genau
# dieses Muster kuenftig fangen - inkl. fuer neue Tasmota-Displays (Matrix1-5)
# und das TOTP-Secret-Format aus dem Matrix5/HUB75-Projekt.

detectors:
  - name: Tasmota WiFi Password (Backlog SSId1/Password1)
    keywords:
      - "SSId1"
      - "Password1"
    regex:
      tasmota_wifi_password: 'Password1\s+([^\s;]{4,})'
    exclude_words:
      - "WiFi-Passwort"
      - "wifi-passwort"

  - name: Tasmota MQTT Password (MqttPassword)
    keywords:
      - "MqttPassword"
    regex:
      tasmota_mqtt_password: 'MqttPassword\s+([^\s;]{2,})'
    exclude_words:
      - "passwort"
      - "MQTT-Passwort"

  - name: TOTP Base32 Secret (Matrix5/HUB75-Projekt)
    keywords:
      - "base32secret"
    regex:
      totp_base32_secret: 'base32secret["\s:=]+"?([A-Z2-7]{16,32})'
    exclude_words:
      # Oeffentlicher RFC-6238-Testvektor, kein echtes Secret - wird in der
      # Matrix5-Doku bewusst als Beispiel verwendet.
      - "JBSWY3DPEHPK3PXP"
